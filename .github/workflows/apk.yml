name: Compilar APK
on: [push, workflow_dispatch]
jobs:
  apk:
    # Ubuntu 24.04 trae el SDK de Android ya instalado
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: unzip -o EconomicoBuceo.zip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar
        working-directory: EconomicoBuceo
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Economico-Buceo-APK
          path: EconomicoBuceo/app/build/outputs/apk/release/*.apk
